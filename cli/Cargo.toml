[package]
name = "bagsy"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Bagsy a concept so your agents don't clobber the brain."
license = "MIT"
repository = "https://github.com/bagsy-dev/bagsy"
keywords = ["okf", "agents", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bagsy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
