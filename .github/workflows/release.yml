# Native CI builds for every supported OS/arch. Do not commit binaries.
#
# Linux is compiled inside ubuntu:22.04 (glibc 2.35) so the result still
# runs on Ubuntu 22.04. The runner VM is ubuntu-24.04 — GitHub is
# deprecating the ubuntu-22.04 *runner image*. Windows is MSVC, not MinGW.
# macOS is the GitHub macOS runner (not zig-cross).
#
#   git tag v0.1.5   # must match npm/package.json and cli/Cargo.toml
#   git push github v0.1.5   # GitHub, not the Cursor origin remote
#
# pull_request (path-filtered) / workflow_dispatch: compile + artifacts.
# Tags create the GitHub Release and (with NPM_TOKEN) publish to npm.

name: release

on:
  pull_request:
    paths:
      - "cli/**"
      - "npm/**"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish platform packages and okfsync to npm
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./npm/package.json').version")
          CARGO=$(sed -n 's/^version = "\([^"]*\)"/\1/p' cli/Cargo.toml | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm=$VERSION cargo=$CARGO"
          if [ "$VERSION" != "$CARGO" ]; then
            echo "npm/package.json version $VERSION != cli/Cargo.toml $CARGO"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "tag $TAG does not match package version v$VERSION"
              exit 1
            fi
          fi

  build-linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: okfsync-linux-x64
            bin: kbsync
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: okfsync-linux-arm64
            bin: kbsync
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential python3 binutils nodejs
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
      - name: Stage asset
        run: |
          mkdir -p dist
          src="cli/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ ! -f "$src" ]; then
            echo "missing $src"
            exit 1
          fi
          strip "$src" || true
          node npm/scripts/assert-max-glibc.js "$src" 2.35
          cp "$src" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: okfsync-darwin-arm64
            bin: kbsync
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: okfsync-darwin-x64
            bin: kbsync
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: okfsync-windows-x64.exe
            bin: kbsync.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          src="cli/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ ! -f "$src" ]; then
            echo "missing $src"
            exit 1
          fi
          cp "$src" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  github-release:
    needs: [version, build-linux, build-native]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

  npm-publish:
    needs: [version, build-linux, build-native]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist/binaries
          merge-multiple: true
      - name: Pack platform packages
        run: node npm/scripts/pack-platforms.js --binaries dist/binaries --out npm/dist/platforms
      - name: Publish platform packages then okfsync
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OKFSYNC_RELEASE_PACK: "1"
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not set; cannot publish to npm"
            exit 1
          fi
          for d in npm/dist/platforms/*; do
            echo "publishing $(basename "$d")"
            npm publish --access public --provenance "$d"
          done
          npm publish --access public --provenance ./npm
